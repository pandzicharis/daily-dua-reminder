<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF7F0">
  <title>Zikr</title>
  <meta name="description" content="Dnevni zikr, dove i stranica Kur'ana — na jednom mjestu.">

  <!-- PWA: bez ovoga "Dodaj na početni ekran" ne daje pravu aplikaciju -->
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- iOS ne čita manifest za sve; ovo su njegove vlastite oznake -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zikr">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

  <!-- ?v= je cache-buster: podigni broj kad promijeniš font.css ili style.css -->
  <link rel="stylesheet" href="font.css?v=9">
  <link rel="stylesheet" href="style.css?v=41">

  <!-- Tema se bira PRIJE prvog crtanja, zato ove dvije skripte stoje ovdje a
       ne dolje sa ostalima: kad bi se čekalo dno strane, noću bi svijetla
       tema bljesnula pa se prebacila u tamnu.

       notification-tasks.js ide uz theme.js jer tema iz njega čita kad
       počinje veče (19:00) a kad dan (07:00) — isti spisak po kojem stižu
       podsjetnici, da satnica ne postoji na dva mjesta. Ostali fajlovi koji
       ga čitaju (badge.js) učitavaju se poslije, pa im je već tu. -->
  <script src="notification-tasks.js"></script>
  <script src="theme.js"></script>
</head>
<body>

  <!-- Header je sticky i poluprovidan (blur) — ostaje na vrhu dok se skrola. -->
  <header class="app-header">

    <!-- Selam je vlastita traka NAD naslovnim redom, a ne red u njemu: među
         datumom i trakama napretka se stopio i nije se vidio. Ovdje ima svoju
         boju i cijelu širinu ekrana, pa je prvo što oko nađe.

         Stoji UNUTAR <header>-a i zato se lijepi za vrh zajedno sa njim —
         jedna ploča, a ne dvije koje se pri skrolanju raziđu.

         Na desnom rubu je oznaka teme (theme.js): sunce ili mlađak, po tome
         koja tema trenutno stoji. Samo oznaka — tema se bira u postavkama,
         pod zupčanikom. Bez imena je cijela traka skrivena — ime u nju piše
         script.js. -->
    <div class="salaam" id="greeting" hidden>
      <div class="wrap salaam-inner">
        <p class="salaam-text">
          <span class="salaam-hi">Es-selamu alejkum,</span>
          <span class="salaam-name" id="greetingName"></span>
        </p>

        <!-- Oznaka, ne dugme: pokazuje koja tema stoji i ništa ne mijenja
             na dodir. Tema se bira u postavkama (settings.js, red „Tema“).

             Obje ikonice stoje u HTML-u, theme.js samo skriva jednu: crtanje
             SVG-a iz JavaScripta ovdje ne bi dobilo ništa, a oznaka bi do
             učitavanja skripte bila prazna. -->
        <span class="salaam-theme" id="themeMark" role="img" aria-label="Tema">
          <svg class="salaam-theme-icon" id="themeSun" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
               hidden>
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.4v2.2M12 19.4v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.4 12h2.2M19.4 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
          </svg>
          <svg class="salaam-theme-icon" id="themeMoon" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
               hidden>
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
          </svg>
        </span>
      </div>
    </div>

    <div class="wrap header-bar">

      <div class="header-left">
        <!-- Rub el-hizb (۞): dva ukrštena kvadrata, klasičan kur'anski znak.
             Tekst naslova ostaje za čitače ekrana, vizuelno je sakriven. -->
        <h1 class="app-title">
          <svg class="app-mark" viewBox="0 0 48 48" fill="none"
               stroke="currentColor" stroke-width="1.6"
               stroke-linejoin="round" aria-hidden="true">
            <rect x="11" y="11" width="26" height="26" rx="1.5"/>
            <rect x="11" y="11" width="26" height="26" rx="1.5"
                  transform="rotate(45 24 24)"/>
            <circle cx="24" cy="24" r="4.6"/>
          </svg>
          <span class="visually-hidden">Zikr</span>
        </h1>

        <p class="date-row">
          <span class="app-date" id="todayDate"></span>
          <span class="app-date-hijri" id="todayHijri"></span>
        </p>
      </div>

      <!-- Postavke — na mjestu gdje je prije stajao prstenasti graf.
           Prsten je uklonjen jer je isto govorio dvaput: trake ispod već
           pokazuju napredak, i to razdvojen po dobu dana. Klik otvara drawer
           (ime, tema, transkripcija, podsjetnici, spisak dova) koji pravi
           settings.js.
           Ikonica je zupčanik. -->
      <button type="button" class="settings-btn" id="settingsBtn"
              aria-label="Postavke" title="Postavke">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>

    </div>

    <!-- Trake po dobu dana — jedini prikaz napretka. Grade se iz istog
         spiska podsjetnika (notification-tasks.js), pa "Dan" ovdje znači
         tačno ono što znači i u obavijesti, i vidi se je li DNEVNI dio gotov
         ili tek večernji nedostaje. -->
    <div class="wrap header-progress" id="progressGroups"></div>
  </header>

  <main class="wrap" id="sectionsRoot"></main>

  <script src="quran-pages.js"></script>
  <script src="data.js"></script>
  <!-- notification-tasks.js i theme.js su gore, u <head> — vidi tamo zašto. -->
  <!-- Redoslijed nije proizvoljan:
       settings.js prvi jer svi ostali pitaju za ime i za config — sync.js
         da zna čiji je spisak, script.js šta da nacrta, notifications.js
         koje ime da zapamti uz pretplatu. Uz to pravi drawer u koji
         notifications.js ubaci svoje dugme.
       sync.js prije script.js: script.js se pri učitavanju odmah uparuje sa
         zajedničkim stanjem, pa mu API mora već postojati.
       badge.js prije script.js iz istog razloga: script.js javi broj za
         ikonicu već pri prvom iscrtavanju. Sam badge.js čita satnicu iz
         notification-tasks.js, pa ide poslije njega. -->
  <script src="settings.js"></script>
  <script src="badge.js"></script>
  <script src="sync.js"></script>
  <script src="script.js"></script>
  <script src="notifications.js"></script>
</body>
</html>
